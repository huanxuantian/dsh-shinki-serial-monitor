# dsh-shinki-serial-monitor bundle patch: inserts the dual-face plugin row
# into the web profile roster (dsh.bundle.patch manifest field). The node
# half (exports ".") runs in the host process (serial service +
# /shinki-serial/* HTTP/WS routes + serial_* agent tools); the dsh.client
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: dsh-shinki-serial-monitor
      name: 'dsh-shinki-serial-monitor'
